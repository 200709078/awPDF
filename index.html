<!DOCTYPE html>
<html xml:lang="tr" lang="tr">

<head>
	<title>awPDF | mADEMatik</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="awPDF — PDF görüntüleme uygulaması. mADEMatik Solutions">
	<meta name="author" content="mADEMatik Solutions">
	<link rel="shortcut icon" href="img/favicon.svg" />
	<!-- Stiller ilk çizimden önce yüklenir. -->
	<link rel="stylesheet" href="/node_modules/pdfjs-dist/legacy/web/pdf_viewer.css" />
	<link rel="stylesheet" href="/src/styles/app.css" />
	<link rel="stylesheet" href="/src/styles/titlebar.css" />
</head>

<body>
	<div id="toolbar" class="toolbar" role="toolbar" aria-label="Araçlar"></div>
	<main id="workspace" class="workspace">
		<div id="viewerContainer" class="viewer-container" tabindex="0" hidden>
			<div id="viewer" class="pdfViewer"></div>
		</div>
		<section id="emptyState" class="empty-state">
			<img src="./img/app-icon.png" width="128" height="128" alt="">
			<h1>awPDF</h1>
			<button id="emptyOpen" class="primary-button" type="button">PDF Aç</button>
		</section>
	</main>
	<input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden>
	<dialog id="largeFileDialog" class="dialog">
		<h2>Bu dosya büyük</h2>
		<p id="largeFileMessage"></p>
		<form method="dialog" class="dialog__actions">
			<button value="cancel" class="secondary-button">Vazgeç</button>
			<button id="largeFileOpen" value="open" class="primary-button">Yine de aç</button>
		</form>
	</dialog>
	<div id="toast" class="toast" role="status" hidden></div>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
