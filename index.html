<!DOCTYPE html>
<html xml:lang="tr" lang="tr">

<head>
	<title>awPDF | mADEMatik</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="awPDF — PDF görüntüleme uygulaması. mADEMatik Solutions">
	<meta name="author" content="mADEMatik Solutions">
	<link rel="shortcut icon" href="img/favicon.svg" />
	<!-- Stiller ilk çizimden önce yüklenir. -->
	<link rel="stylesheet" href="/node_modules/pdfjs-dist/legacy/web/pdf_viewer.css" />
	<link rel="stylesheet" href="/src/styles/app.css" />
	<link rel="stylesheet" href="/src/styles/titlebar.css" />
</head>

<body>
	<div id="toolbar" class="toolbar" role="toolbar" aria-label="Araçlar"></div>
	<div id="searchBar" class="search-bar" role="search" hidden>
		<input id="searchInput" type="search" placeholder="Metinde ara" aria-label="Metinde ara" autocomplete="off">
		<span id="searchStatus" class="search-bar__status" aria-live="polite"></span>
		<button id="searchPrevious" class="secondary-button" type="button" aria-label="Önceki eşleşme" title="Önceki eşleşme">↑</button>
		<button id="searchNext" class="secondary-button" type="button" aria-label="Sonraki eşleşme" title="Sonraki eşleşme">↓</button>
		<button id="searchClose" class="secondary-button" type="button" aria-label="Aramayı kapat" title="Aramayı kapat">✕</button>
	</div>
	<main id="workspace" class="workspace">
		<aside id="sidePanel" class="side-panel" aria-label="Sayfa paneli" hidden>
			<div id="sidePanelTabs" class="side-panel__tabs" role="tablist" hidden>
				<button id="sidePanelPagesTab" type="button" role="tab" aria-selected="true">Sayfalar</button>
				<button id="sidePanelOutlineTab" type="button" role="tab" aria-selected="false">İçindekiler</button>
			</div>
			<div id="thumbnailList" class="side-panel__list"></div>
			<div id="outlineList" class="side-panel__list outline" hidden></div>
		</aside>
		<div class="document-area">
			<div id="viewerContainer" class="viewer-container" tabindex="0" hidden>
				<div id="viewer" class="pdfViewer"></div>
			</div>
			<section id="emptyState" class="empty-state">
				<img src="./img/app-icon.png" width="128" height="128" alt="">
				<h1>awPDF</h1>
				<button id="emptyOpen" class="primary-button" type="button">PDF Aç</button>
				<div id="recentFiles" class="recent-files" hidden>
					<h2>Son Dosyalar</h2>
					<div id="recentFilesList" class="recent-files__list"></div>
					<button class="secondary-button recent-clear" type="button">Listeyi Temizle</button>
				</div>
			</section>
		</div>
	</main>
	<input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden>
	<dialog id="largeFileDialog" class="dialog">
		<h2>Bu dosya büyük</h2>
		<p id="largeFileMessage"></p>
		<form method="dialog" class="dialog__actions">
			<button value="cancel" class="secondary-button">Vazgeç</button>
			<button id="largeFileOpen" value="open" class="primary-button">Yine de aç</button>
		</form>
	</dialog>
	<dialog id="goToPageDialog" class="dialog">
		<h2>Sayfaya git</h2>
		<form method="dialog">
			<label class="dialog__field">
				<span id="goToPageHint"></span>
				<input id="goToPageInput" type="number" inputmode="numeric" min="1" step="1" required>
			</label>
			<div class="dialog__actions">
				<button value="go" class="primary-button">Git</button>
				<button value="cancel" class="secondary-button" formnovalidate>Vazgeç</button>
			</div>
		</form>
	</dialog>
	<dialog id="externalLinkDialog" class="dialog">
		<h2>Dış bağlantı</h2>
		<p>Bu bağlantı uygulamanın dışında açılacak:</p>
		<p id="externalLinkUrl" class="dialog__address"></p>
		<form method="dialog" class="dialog__actions">
			<button value="open" class="primary-button">Aç</button>
			<button value="cancel" class="secondary-button">Vazgeç</button>
		</form>
	</dialog>
	<dialog id="recentDialog" class="dialog">
		<h2>Son Dosyalar</h2>
		<p id="recentDialogEmpty">Henüz açılmış bir dosya yok.</p>
		<div id="recentDialogList" class="recent-files__list"></div>
		<form method="dialog" class="dialog__actions">
			<button value="close" class="primary-button">Kapat</button>
			<button class="secondary-button recent-clear" type="button">Listeyi Temizle</button>
		</form>
	</dialog>
	<dialog id="printDialog" class="dialog">
		<h2>Yazdırmaya hazırlanıyor</h2>
		<p id="printProgress"></p>
		<form method="dialog" class="dialog__actions">
			<button value="cancel" class="secondary-button">Vazgeç</button>
		</form>
	</dialog>
	<div id="toast" class="toast" role="status" hidden></div>
	<div id="printContainer" class="print-container"></div>
	<style id="printPageSize"></style>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
